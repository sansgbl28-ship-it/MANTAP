<script>

let redirectTimer = null;
let currentVideo = null;


/* ============================================
   PLAY VIDEO
   ============================================ */

function playVideo(videoUrl, directLink) {

    const player = document.getElementById("videoPlayer");
    const status = document.getElementById("status");


    /* Hentikan timer sebelumnya */

    if (redirectTimer) {
        clearTimeout(redirectTimer);
        redirectTimer = null;
    }


    /* Simpan video aktif */

    currentVideo = player;


    /* Simpan direct link */

    player.dataset.directLink = directLink;


    /* Masukkan video */

    player.src = videoUrl;


    /* Tampilkan video */

    player.style.display = "block";


    /* Tampilkan status */

    status.style.display = "block";
    status.innerHTML = "Memuat video...";


    /* Load video */

    player.load();


    /* Scroll ke video */

    setTimeout(function() {

        player.scrollIntoView({
            behavior: "smooth",
            block: "center"
        });

    }, 100);


    /*
     * Coba memutar video.
     */

    player.play().then(function() {

        /*
         * Video berhasil mulai.
         * Sekarang baru mulai timer 15 detik.
         */

        start15SecondTimer(
            player,
            directLink,
            status
        );

    }).catch(function() {

        /*
         * Autoplay diblokir browser.
         * Timer belum dimulai.
         */

        status.innerHTML =
            "Tekan tombol ▶ pada video untuk mulai.";

    });
}


/* ============================================
   TIMER 15 DETIK
   ============================================ */

function start15SecondTimer(
    player,
    directLink,
    status
) {

    /* Hentikan timer lama */

    if (redirectTimer) {
        clearTimeout(redirectTimer);
    }


    status.innerHTML =
        "Video sedang diputar...";


    /*
     * Tunggu 15 detik
     */

    redirectTimer = setTimeout(function() {

        /*
         * Pastikan video masih aktif
         */

        if (currentVideo !== player) {
            return;
        }


        /* Hentikan video */

        player.pause();


        /* Ubah status */

        status.innerHTML =
            "Mengalihkan...";


        /*
         * REDIRECT DIRECT LINK
         *
         * Redirect baru terjadi
         * setelah 15 detik.
         */

        window.location.href = directLink;


    }, 15000);
}


/* ============================================
   JIKA AUTOPLAY DIBLOKIR
   ============================================ */

document.getElementById("videoPlayer").addEventListener(
    "play",
    function() {

        const player = this;

        /*
         * Kalau timer sudah berjalan,
         * jangan membuat timer kedua.
         */

        if (redirectTimer) {
            return;
        }


        /*
         * Kalau user menekan tombol Play
         * secara manual, mulai timer.
         */

        if (player.dataset.directLink) {

            start15SecondTimer(
                player,
                player.dataset.directLink,
                document.getElementById("status")
            );

        }

    }
);

</script>
